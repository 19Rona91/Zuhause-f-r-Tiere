<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tierheim Profi-Vermittlung</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }
        .header {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subheader {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        /* Profi-Filterbereich */
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin: 0 auto 30px auto;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            font-size: 11px;
            font-weight: bold;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-group select, .filter-group input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            background-color: #fff;
            font-size: 14px;
            color: #2c3e50;
            outline: none;
        }
        .filter-group select:focus {
            border-color: #3498db;
        }
        /* Tier-Raster */
        .tier-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tier-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tier-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .tier-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }
        .tier-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .tier-info h3 {
            margin: 0 0 5px 0;
            font-size: 22px;
        }
        .tierheim-name {
            font-size: 13px;
            color: #3498db;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }
        .tag {
            background: #f1f2f6;
            color: #57606f;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }
        .tag.highlight {
            background: #e3f2fd;
            color: #1e88e5;
        }
        .btn-details {
            background: #2ecc71;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: auto;
            transition: background 0.2s;
        }
        .btn-details:hover {
            background: #27ae60;
        }
        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: #7f8c8d;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">🐾 Tierheim Suchportal</div>
    <div class="subheader">Finde das Tier, das perfekt zu deinem Leben passt</div>

    <!-- Die erweiterte Filterleiste -->
    <div class="filter-section">
        <div class="filter-group">
            <label for="filterArt">Tierart</label>
            <select id="filterArt" onchange="filtereUndSortiereTiere()">
                <option value="alle">Alle</option>
                <option value="Hund">Hunde</option>
                <option value="Katze">Katzen</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterGeschlecht">Geschlecht</label>
            <select id="filterGeschlecht" onchange="filtereUndSortiereTiere()">
                <option value="egal">Egal</option>
                <option value="männlich">männlich</option>
                <option value="weiblich">weiblich</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterGroesse">Größe (Hunde)</label>
            <select id="filterGroesse" onchange="filtereUndSortiereTiere()">
                <option value="egal">Egal</option>
                <option value="klein">klein (bis 39cm)</option>
                <option value="mittel">mittel (40-59cm)</option>
                <option value="groß">groß (ab 60cm)</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterKastriert">Kastriert?</label>
            <select id="filterKastriert" onchange="filtereUndSortiereTiere()">
                <option value="egal">Egal</option>
                <option value="ja">Ja</option>
                <option value="nein">Nein</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterUmfeld">Wohnen & Umfeld</label>
            <select id="filterUmfeld" onchange="filtereUndSortiereTiere()">
                <option value="egal">Egal</option>
                <option value="familie">Familienfreundlich</option>
                <option value="wohnung">Wohnungshaltung</option>
                <option value="freigang">Freigang (Katzen)</option>
                <option value="alleinhaltung">Nur Alleinhaltung</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filterVertraeglichkeit">Verträglich mit...</label>
            <select id="filterVertraeglichkeit" onchange="filtereUndSortiereTiere()">
                <option value="egal">Egal</option>
                <option value="hunde">Hunden allgemein</option>
                <option value="katzen">Katzen allgemein</option>
                <option value="rueden">Rüden</option>
                <option value="huendinnen">Hündinnen</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="sortierung">Sortierung</label>
            <select id="sortierung" onchange="filtereUndSortiereTiere()">
                <option value="standard">Standard</option>
                <option value="alterAuf">Alter: Jung nach Alt</option>
                <option value="entfernung">Entfernung: Nah nach Weit</option>
            </select>
        </div>
    </div>

    <div class="tier-grid" id="tierGrid"></div>

    <script>
        // Nutzer-Standort (wird geladen wenn nach Entfernung sortiert wird)
        let userLat = null;

        // Funktion zur Berechnung der Luftlinie (Haversine-Formel)
        function berechneEntfernung(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1) return null;
            const R = 6371; // Erdradius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
